name: Rust contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked --no-default-features --features experimental
      - run: cargo doc --locked --no-default-features --no-deps
  comparisons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo fmt --all --check
      - run: cargo bench --locked --features comparisons --no-run
      - name: Exact comparator behavior (no speed claims from shared CI)
        run: |
          for engine in rill-4096-64 rillfast-4096-64 probe-70-0 probe-70-64 shared-70-0 shared-70-16 shared-85-256 record-50-0 record-70-16 record-85-256 split-70 contrie-copy leapfrog-copy scc-capture flashmap-copy evmap-copy left-right-copy imbl-hash imbl-fast im-fast imhm rpds-hash rpds-fast hashbrown chunkbatch-16 vart skipdb mvcc-16; do
            cargo bench --locked --features comparisons --bench state -- --engine "$engine" --case churn --records 2000 --readers 2000 --rounds 12 --verify
          done
      - name: Concurrent publication contracts
        run: |
          for engine in rwlock mutex arc-swap rcu-cell; do
            cargo bench --locked --features comparisons --bench publication -- --engine "$engine" --threads 4 --rounds 32 --verify
          done
      - name: Investigative SwapArc baseline (known arm64 freshness failure retained)
        continue-on-error: true
        run: cargo bench --locked --features comparisons --bench publication -- --engine swap-arc --threads 8 --rounds 32 --verify
      - name: Generic key and payload shapes
        run: |
          for engine in hashbrown imbl-fast im-fast rpds-fast imhm probe-flat probe-paged16 shared-flat shared-paged16 record-flat record-paged16 split rillfast; do
            for shape in u64-inline string-inline u64-owned256 string-owned256 u64-shared256 string-shared256 mixed-owned mixed-shared; do
              cargo bench --locked --features comparisons --bench shapes -- --engine "$engine" --shape "$shape" --case churn --records 1000 --readers 1000 --rounds 6 --verify
            done
          done
      - name: Native guarded-reader progress contracts
        run: cargo run --locked --release --features comparisons --example guarded_retention
      - name: Native SCC capacity-growth reproduction and live-count correction
        run: |
          cargo run --locked --release --features comparisons --example scc_probe -- --capacity-only
          cargo run --locked --release --features comparisons --example scc_probe -- --by-len
      - name: Concurrent retained generic views
        run: |
          for engine in hashbrown imbl-fast rpds-fast probe-paged16 shared-paged16 record-paged16 rillfast; do
            cargo bench --locked --features comparisons --bench shapes -- --engine "$engine" --shape string-owned256 --case sparse --records 1000 --readers 2000 --rounds 6 --thread-check
          done
